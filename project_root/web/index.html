<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Network 3D Explorer</title>
    <style>
        :root {
            --panel-bg: rgba(18, 20, 24, 0.88);
            --panel-border: #3a3f48;
            --accent: #8ecae6;
            --warm: #e08a3c;
            --text: #e8eaed;
            --muted: #8a9099;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0c0d10; color: var(--text);
        }
        canvas { display: block; }

        #left-panel {
            position: absolute; top: 16px; left: 16px; bottom: 16px;
            width: 310px; z-index: 10;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 12px;
            padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 10px 36px rgba(0,0,0,0.4);
        }
        #left-panel h1 {
            margin: 0 0 8px 0;
            font-size: 1.05em;
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }
        #left-panel .subtitle {
            margin: 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        .section-label {
            font-size: 0.72em; color: var(--muted); letter-spacing: 0.04em;
            text-transform: uppercase; margin-bottom: 6px;
        }
        #search-form { display: flex; gap: 6px; }
        #search-input {
            flex: 1; background: #1a1d24; border: 1px solid #455; color: var(--text);
            border-radius: 8px; padding: 9px 11px; font-size: 0.9em; outline: none;
        }
        #search-input:focus { border-color: var(--accent); }
        #search-input::placeholder { color: #666; }
        .btn {
            background: #2a303a; border: 1px solid #4a5560; color: var(--text);
            border-radius: 8px; padding: 9px 12px; font-size: 0.85em; cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { background: #343b48; border-color: #6a7580; }
        .btn-primary { background: rgba(90, 158, 200, 0.25); border-color: #4a90b8; color: #b8e0f5; }
        .btn-primary:hover { background: rgba(90, 158, 200, 0.4); }
        .btn-ghost {
            width: 100%; background: transparent; border: 1px dashed #455;
            color: var(--muted); font-size: 0.8em;
        }
        .btn-ghost:hover { color: var(--text); border-color: #677; }

        .seg-toggle {
            display: flex; width: 100%; border: 1px solid #3d4550; border-radius: 8px; overflow: hidden;
        }
        .seg-toggle button {
            flex: 1; background: #1a1d24; border: none; border-right: 1px solid #3d4550;
            color: var(--muted); padding: 7px 4px; font-size: 0.72em; cursor: pointer;
        }
        .seg-toggle button:last-child { border-right: none; }
        .seg-toggle button:hover { color: var(--text); background: #242830; }
        .seg-toggle button.active {
            background: rgba(90, 158, 200, 0.22); color: #c5e6f5;
        }

        #quick-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-btn {
            background: #1e232b; border: 1px solid #3d4550; color: #c8ced6;
            border-radius: 999px; padding: 5px 10px; font-size: 0.75em; cursor: pointer;
        }
        .tag-btn:hover, .tag-btn.active {
            border-color: var(--warm); color: #f0c090;
            background: rgba(224, 138, 60, 0.15);
        }

        #trail-section { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
        #trail-list {
            flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0;
            border: 1px solid #2a3038; border-radius: 8px; background: rgba(0,0,0,0.2);
        }
        #trail-list:empty::after {
            content: 'まだ痕跡はありません。興味から探索を始めてください。';
            display: block; padding: 14px; font-size: 0.8em; color: #666; line-height: 1.45;
        }
        .trail-item {
            display: flex; align-items: flex-start; gap: 8px;
            width: 100%; text-align: left; background: transparent; border: none;
            border-bottom: 1px solid #2a3038; color: var(--text);
            padding: 10px 12px; cursor: pointer; font: inherit;
        }
        .trail-item:last-child { border-bottom: none; }
        .trail-item:hover { background: rgba(255,255,255,0.04); }
        .trail-dot {
            width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
        }
        .trail-dot.professor { background: var(--warm); }
        .trail-dot.course { background: var(--accent); }
        .trail-meta { font-size: 0.68em; color: var(--muted); }
        .trail-name { font-size: 0.84em; line-height: 1.3; }
        .trail-controls {
            display: flex; flex-direction: column; gap: 6px;
        }
        .trail-filter-row {
            display: flex; align-items: flex-start; gap: 8px;
            font-size: 0.78em; color: #c8ced6; line-height: 1.35; cursor: pointer;
            user-select: none;
        }
        .trail-filter-row input {
            margin-top: 2px; accent-color: #5a9ec8; flex-shrink: 0;
        }
        #clear-trail-btn {
            width: 100%; padding: 6px 10px; font-size: 0.75em;
        }

        #empty-hint {
            position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
            text-align: center; color: #6a7078; pointer-events: none; z-index: 5;
            transition: opacity 0.4s ease;
        }
        #empty-hint strong { display: block; color: #9aa0a8; font-size: 1.1em; margin-bottom: 8px; font-weight: 500; }
        #empty-hint span { font-size: 0.85em; }

        #info-panel {
            position: absolute; top: 16px; right: 16px; width: 320px; z-index: 10;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px; border: 1px solid var(--panel-border);
            display: none; box-shadow: 0 10px 36px rgba(0,0,0,0.4);
            max-height: calc(100vh - 32px); overflow-y: auto;
        }
        #info-panel .type-badge {
            display: inline-block; font-size: 0.7em; letter-spacing: 0.06em;
            text-transform: uppercase; padding: 2px 8px; border-radius: 4px;
            margin-bottom: 8px;
        }
        #info-panel .type-badge.professor {
            background: rgba(232, 140, 74, 0.25); color: #f0b27a; border: 1px solid #c77a3a;
        }
        #info-panel .type-badge.course {
            background: rgba(90, 170, 220, 0.2); color: #8ecae6; border: 1px solid #4a90b8;
        }
        #info-panel h2 { margin: 0 0 12px 0; font-size: 1.15em; line-height: 1.35; color: #f2f4f7; }
        .info-row { margin-bottom: 10px; font-size: 0.9em; line-height: 1.45; }
        .info-label { display: block; color: var(--muted); font-size: 0.75em; margin-bottom: 2px; }
        .info-value { color: var(--text); }
        .info-link {
            color: var(--accent); cursor: pointer; text-decoration: underline;
            text-underline-offset: 2px; background: none; border: none;
            padding: 0; font: inherit;
        }
        .info-link:hover { color: #b8e0f5; }
        .keyword-chip {
            display: inline-block; background: #2a2e36; padding: 2px 8px;
            border-radius: 10px; font-size: 0.78em; margin: 2px;
            border: 1px solid #4a505a; color: #d0d4da;
        }
        .preview-text {
            white-space: pre-wrap; font-size: 0.85em; color: #c5c9d0;
            line-height: 1.5; max-height: 220px; overflow-y: auto;
        }
        #panel-close {
            position: absolute; top: 12px; right: 14px;
            background: transparent; border: none; color: #888;
            font-size: 1.2em; cursor: pointer; line-height: 1;
        }
        #panel-close:hover { color: #fff; }

        #status-toast {
            position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
            background: rgba(30, 34, 40, 0.9); border: 1px solid #455;
            color: #c8ced6; padding: 8px 14px; border-radius: 8px;
            font-size: 0.8em; z-index: 8; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #status-toast.show { opacity: 1; }

        #op-guide {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            letter-spacing: 0.02em;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        }

        .ext-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 14px;
            padding: 8px 12px;
            font-size: 0.82em;
            color: #c5e6f5;
            background: rgba(90, 158, 200, 0.12);
            border: 1px solid #4a90b8;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .ext-link-btn:hover {
            background: rgba(90, 158, 200, 0.28);
            border-color: #6eb0d4;
            color: #e8f6fc;
        }
        .ext-link-btn.is-disabled,
        .ext-link-btn[aria-disabled="true"] {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }
        .ext-link-btn .ext-icon { font-size: 0.95em; opacity: 0.9; }

        #hover-tip {
            position: absolute; z-index: 12; display: none; pointer-events: none;
            max-width: 260px; padding: 8px 10px;
            background: rgba(16, 18, 22, 0.94); border: 1px solid #4a5560;
            border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            font-size: 0.78em; line-height: 1.4; color: #e8eaed;
        }
        #hover-tip .tip-type { font-size: 0.72em; color: var(--muted); margin-bottom: 2px; }
        #hover-tip .tip-name { font-weight: 600; margin-bottom: 4px; }
        #hover-tip .tip-kw { color: #aeb6c0; font-size: 0.92em; }

        .node-label {
            color: #e8eaed; font-size: 11px; line-height: 1.25;
            padding: 2px 7px; border-radius: 4px;
            background: rgba(12, 14, 18, 0.78);
            border: 1px solid rgba(80, 90, 100, 0.45);
            white-space: nowrap; pointer-events: none; user-select: none;
            max-width: 150px; overflow: hidden; text-overflow: ellipsis;
            transform: translateY(-12px);
            transition: opacity 0.2s ease;
        }
        .node-label.professor {
            color: #f0c090; border-color: rgba(224, 138, 60, 0.45); font-weight: 600;
        }
        .node-label.course {
            color: #c5e0f0;
            border-color: rgba(120, 180, 210, 0.35);
            font-size: 9px;
            font-weight: 500;
            background: rgba(10, 16, 22, 0.7);
            max-width: 110px;
            padding: 1px 5px;
            transform: translateY(-6px);
            opacity: 0.9;
        }
        .node-label.field {
            color: #dce8f0; border-color: rgba(120, 170, 200, 0.55);
            font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
            background: rgba(10, 16, 24, 0.72);
            max-width: 200px; padding: 4px 10px;
            transform: translateY(-18px);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .node-label.major {
            color: #f2f6fa; border-color: rgba(180, 200, 220, 0.5);
            font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
            background: rgba(8, 12, 18, 0.55);
            max-width: 240px; padding: 6px 14px;
            transform: translateY(-28px);
            text-shadow: 0 2px 12px rgba(0,0,0,0.55);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .node-label.field:hover,
        .node-label.major:hover {
            background: rgba(90, 158, 200, 0.42);
            border-color: #8ecae6;
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .node-label.field:active,
        .node-label.major:active {
            background: rgba(90, 158, 200, 0.55);
        }
        .node-label.hidden-label { display: none !important; }

        .prof-billboard {
            display: flex; flex-direction: column; align-items: center;
            pointer-events: none; user-select: none;
            transition: opacity 0.25s ease;
        }
        .prof-billboard .photo {
            width: 52px; height: 52px; border-radius: 50%;
            object-fit: cover; background: #2a3038;
            border: 2px solid rgba(224, 138, 60, 0.75);
            box-shadow: 0 4px 14px rgba(0,0,0,0.45);
        }
        .prof-billboard .photo.placeholder {
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #f0c090; font-weight: 700;
            background: linear-gradient(145deg, #3a2a1a, #1e232b);
        }
        .prof-billboard .caption {
            margin-top: 4px; text-align: center;
            max-width: 120px; line-height: 1.25;
            padding: 2px 6px; border-radius: 4px;
            background: rgba(12, 14, 18, 0.82);
            border: 1px solid rgba(80, 90, 100, 0.4);
        }
        .prof-billboard .caption .nm {
            display: block; font-size: 11px; font-weight: 600; color: #f0c090;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .prof-billboard .caption .af {
            display: block; font-size: 9px; color: #9aa3ad;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #info-panel .type-badge.field,
        #info-panel .type-badge.major {
            background: rgba(90, 140, 180, 0.22); color: #b8d4e8; border: 1px solid #5a8ab0;
        }
        .trail-dot.field, .trail-dot.major { background: #7eb0d0; }

        @media (max-width: 900px) {
            #left-panel { width: 260px; }
            #info-panel { width: 280px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>

    <aside id="left-panel">
        <div>
            <h1>知識の地図を育てる</h1>
            <p class="subtitle">分野のランドマークに近づき、教員との意外なつながりを発見します</p>
        </div>

        <div>
            <div class="section-label">興味のある言葉</div>
            <form id="search-form">
                <input id="search-input" type="search" placeholder="例: ロボット / 触覚 / まちづくり" autocomplete="off">
                <button class="btn btn-primary" type="submit">探索</button>
            </form>
        </div>

        <div>
            <div class="section-label">クイック関心</div>
            <div id="quick-tags"></div>
        </div>

        <div>
            <div class="section-label">ラベル表示</div>
            <div class="seg-toggle" id="label-mode-toggle" role="group" aria-label="ラベル表示切替">
                <button type="button" data-mode="name" class="active">名称</button>
                <button type="button" data-mode="keywords">主要キーワード</button>
                <button type="button" data-mode="hidden">非表示</button>
            </div>
        </div>

        <button id="reset-btn" class="btn btn-ghost" type="button">探索をリセット</button>

        <div id="trail-section">
            <div class="section-label">探索の痕跡</div>
            <div class="trail-controls">
                <label class="trail-filter-row" for="trail-filter-toggle">
                    <input type="checkbox" id="trail-filter-toggle">
                    <span>今までクリックしたノードのみ表示</span>
                </label>
                <button id="clear-trail-btn" class="btn btn-ghost" type="button">履歴をクリア</button>
            </div>
            <div id="trail-list"></div>
        </div>
    </aside>

    <div id="empty-hint">
        <strong>分野の地図が広がっています</strong>
        <span>ズームで教員 → さらに近づくと講義が衛星のように現れます</span>
    </div>

    <div id="status-toast"></div>
    <div id="hover-tip"></div>
    <div id="op-guide">ドラッグで回転 ・ ホイールでズーム（近づくと教員が現れる） ・ ノードをクリックで詳細</div>

    <div id="info-panel">
        <button id="panel-close" type="button" aria-label="閉じる">×</button>
        <div id="p-type" class="type-badge">—</div>
        <h2 id="p-name">—</h2>
        <div id="panel-body"></div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0c0d10, 0.0018);
        scene.background = new THREE.Color(0x0c0d10);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 40, 165);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '4';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const PROF_COLOR = 0xe08a3c;
        const COURSE_COLOR = 0x5a9ec8;
        const FIELD_COLOR = 0x6a9ec0;
        const MAJOR_COLOR = 0xa8c8dc;
        // Field-joint UMAP coords are ~±28; enlarge so LOD has room to breathe
        const SCALE = 2.4;
        const ENTRY_COUNT = 5;
        const SIM_EXPAND_TOP = 2; // discovery: top similarity bridges
        const COURSE_NAME_MAX = 10;
        const PROF_MIN_DIST = 2.2; // after SCALE, in world units between professors
        const COURSE_MIN_DIST = 1.05; // same-type course repulsion only
        const LABEL_NEAR = 45;
        const LABEL_FAR = 95;

        // LOD hierarchy: field (far) → professor (mid) → course (near, by own position)
        const LOD_FIELD_NEAR = 11;
        const LOD_FIELD_FAR = 20;
        const LOD_EDGE_NEAR = 10;
        const LOD_EDGE_FAR = 17;
        // Courses fade in when the camera/focus approaches the course itself
        // (syllabus UMAP coords — not orbit satellites around instructors)
        const LOD_COURSE_NEAR = 7.5;
        const LOD_COURSE_FAR = 14.0;
        // Field wireframe opacity: solid landmark far away, fade when close
        const FIELD_OPACITY_FAR = 0.30;
        const FIELD_OPACITY_NEAR = 0.10;
        const MAJOR_OPACITY_FAR = 0.34;
        const MAJOR_OPACITY_NEAR = 0.10;
        const FOCUS_DIM = 0.10;
        const TRAIL_DIM = 0.05;
        const TAUGHT_BY_FOCUS_COLOR = 0x2ee6ff;

        const QUICK_TAGS = [
            { label: 'AI・データ', terms: ['AI', 'データ', '機械学習', 'DX', 'データサイエンス', '情報'] },
            { label: '地域・まちづくり', terms: ['地域', 'まちづくり', '都市', '観光', 'コミュニティ', '復興'] },
            { label: 'デザイン思考', terms: ['デザイン', '創造', 'STEAM', 'アート', '思考'] },
            { label: '医療・健康', terms: ['医療', '健康', '医学', '看護', '予防', 'リハビリテーション'] },
            { label: 'ロボティクス', terms: ['ロボット', 'ロボティクス', '制御', 'メカトロ', '自律'] },
        ];

        const nodeMeshes = [];
        const fieldMeshes = [];
        const professorMeshes = [];
        const courseMeshes = [];
        const midMeshes = []; // professors + courses (LOD-controlled)
        const nodeDict = {};
        const meshById = {};
        const edgeRecords = []; // {source,target,type,score,line,material,lod}
        const edgesByNode = new Map(); // id -> edgeRecords[]
        const trail = []; // {id, name, type} — visitedNodes (deduped, chronological)
        const fieldMemberIds = new Map(); // fieldId -> Set(profId)

        let selectedNode = null;
        let hoveredNode = null;
        let dataReady = false;
        let camTween = null;
        let labelMode = 'name'; // name | keywords | hidden
        const fadeAnims = [];
        let searchPinned = new Set(); // course/prof ids forced visible by search/expand
        let lodFrame = 0;
        let trailFilterOn = false;
        // Professor focus: emphasize taught_by edges + connected courses
        let focusHighlight = null; // { profId, courseIds: Set, edges: Set<rec> }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const infoPanel = document.getElementById('info-panel');
        const panelBody = document.getElementById('panel-body');
        const emptyHint = document.getElementById('empty-hint');
        const trailList = document.getElementById('trail-list');
        const toastEl = document.getElementById('status-toast');
        const leftPanel = document.getElementById('left-panel');
        const hoverTip = document.getElementById('hover-tip');

        function truncateText(str, max) {
            const t = String(str || '').replace(/\s+/g, ' ').trim();
            if (t.length <= max) return t;
            return t.slice(0, max) + '…';
        }

        function nameLabelText(node) {
            if (node.type === 'course') return truncateText(node.name || node.id, COURSE_NAME_MAX);
            return node.name || node.id || '';
        }

        function keywordLabelText(node) {
            if (node.type === 'field' || node.type === 'major') return nameLabelText(node);
            const kws = (node.keywords || []).map(k => String(k).trim()).filter(Boolean);
            if (!kws.length) return nameLabelText(node);
            return truncateText(kws.slice(0, 3).join(' · '), 18);
        }

        function labelTextFor(node) {
            if (labelMode === 'keywords') return keywordLabelText(node);
            return nameLabelText(node);
        }

        function isLandmark(node) {
            return node && (node.type === 'field' || node.type === 'major');
        }

        function isMidNode(node) {
            return node && (node.type === 'professor' || node.type === 'course');
        }

        function lodAlpha(dist, near, far) {
            if (dist <= near) return 1;
            if (dist >= far) return 0;
            return 1 - (dist - near) / (far - near);
        }

        function getActiveFieldAlphas() {
            // Rank by orbit focus (what the user is looking at), not camera position.
            // Embedding clusters fields tightly; camera-distance alone picks neighbors along the LOS.
            const TOP_N = 2;
            const focus = controls.target;
            const scored = [];
            for (const mesh of fieldMeshes) {
                if (mesh.userData.type !== 'field') continue;
                const distCam = camera.position.distanceTo(mesh.position);
                // Must physically approach — overview camera never unlocks members
                if (distCam > LOD_FIELD_FAR) continue;
                const distFocus = focus.distanceTo(mesh.position);
                const alphaFocus = lodAlpha(distFocus, LOD_FIELD_NEAR * 0.55, LOD_FIELD_FAR * 0.75);
                const alphaCam = lodAlpha(distCam, LOD_FIELD_NEAR, LOD_FIELD_FAR);
                const alpha = Math.max(alphaFocus, alphaCam * 0.85);
                if (alpha > 0.02) {
                    scored.push({ id: mesh.userData.id, alpha, distFocus, distCam });
                }
            }
            scored.sort((a, b) => a.distFocus - b.distFocus || b.alpha - a.alpha);
            const active = new Map();
            for (const row of scored.slice(0, TOP_N)) {
                active.set(row.id, row.alpha);
            }
            return active;
        }

        function professorLodAlpha(mesh, activeFields) {
            let alpha = 0;
            const connected = edgesByNode.get(mesh.userData.id) || [];
            for (const rec of connected) {
                if (rec.type !== 'belongs_to_field') continue;
                const fieldId = rec.source === mesh.userData.id ? rec.target : rec.source;
                const a = activeFields.get(fieldId);
                if (a) alpha = Math.max(alpha, a);
            }
            return alpha;
        }

        function syncNodeLabel(mesh) {
            const label = mesh.userData.labelObj;
            const el = mesh.userData.labelEl;
            if (!label || !el) return;
            // Professor billboards carry their own caption; hide CSS2D name label
            if (mesh.userData.type === 'professor' && mesh.userData.billboardEl) {
                label.visible = false;
                el.classList.add('hidden-label');
                return;
            }
            if (!mesh.visible || labelMode === 'hidden') {
                label.visible = false;
                el.classList.add('hidden-label');
                el.style.opacity = '0';
                return;
            }
            el.textContent = labelTextFor(mesh.userData);
            applyLabelDistance(mesh);
        }

        function applyLabelDistance(mesh) {
            const label = mesh.userData.labelObj;
            const el = mesh.userData.labelEl;
            if (!label || !el || !mesh.visible || labelMode === 'hidden') return;
            if (mesh.userData.type === 'professor' && mesh.userData.billboardEl) return;

            // Landmark labels stay readable farther out
            const near = isLandmark(mesh.userData) ? 55 : LABEL_NEAR;
            const far = isLandmark(mesh.userData) ? 120 : LABEL_FAR;
            const dist = camera.position.distanceTo(mesh.position);
            if (dist > far) {
                label.visible = false;
                el.classList.add('hidden-label');
                el.style.opacity = '0';
                return;
            }
            label.visible = true;
            el.classList.remove('hidden-label');
            const t = dist <= near
                ? 1
                : 1 - (dist - near) / (far - near);
            el.style.opacity = String(Math.max(0.15, Math.min(1, t)));
        }

        function updateVisibleLabelDistances() {
            if (labelMode === 'hidden') {
                for (const mesh of fieldMeshes) applyLabelDistance(mesh);
                return;
            }
            for (const mesh of nodeMeshes) {
                if (mesh.visible) applyLabelDistance(mesh);
            }
        }

        function separateSameTypeNodes(nodes, minDist, iterations = 40) {
            // Same-layer repulsion only (professor⇄professor / course⇄course).
            // Never push against field landmarks — membership containment stays intact.
            for (let iter = 0; iter < iterations; iter++) {
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const a = nodes[i].vec3;
                        const b = nodes[j].vec3;
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dz = a.z - b.z;
                        let d = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        if (d >= minDist) continue;
                        if (d < 1e-5) {
                            const ang = (i * 12.9898 + j * 78.233) % (Math.PI * 2);
                            a.x += Math.cos(ang) * minDist * 0.5;
                            a.z += Math.sin(ang) * minDist * 0.5;
                            continue;
                        }
                        const push = (minDist - d) * 0.52;
                        const nx = dx / d;
                        const ny = dy / d;
                        const nz = dz / d;
                        a.x += nx * push;
                        a.y += ny * push * 0.85;
                        a.z += nz * push;
                        b.x -= nx * push;
                        b.y -= ny * push * 0.85;
                        b.z -= nz * push;
                    }
                }
            }
        }

        function separateOverlappingNodes() {
            const profs = [];
            const courses = [];
            for (const id in nodeDict) {
                const n = nodeDict[id];
                if (!n.vec3) continue;
                if (n.type === 'professor') profs.push(n);
                else if (n.type === 'course') courses.push(n);
            }
            separateSameTypeNodes(profs, PROF_MIN_DIST, 48);
            separateSameTypeNodes(courses, COURSE_MIN_DIST, 36);
        }

        function refreshAllLabels() {
            nodeMeshes.forEach(syncNodeLabel);
        }

        function showHoverTip(node, clientX, clientY) {
            if (!node) {
                hoverTip.style.display = 'none';
                return;
            }
            const typeLabel = node.type === 'professor' ? '教員'
                : node.type === 'course' ? '講義'
                : node.type === 'major' ? '大分野'
                : node.type === 'field' ? '研究分野'
                : '';
            const kws = (node.keywords || []).slice(0, 4).join(' · ')
                || (isLandmark(node) ? `所属教員 ${node.member_count || 0} 名` : '—');
            hoverTip.innerHTML = `
                <div class="tip-type">${escapeHtml(typeLabel)}</div>
                <div class="tip-name">${escapeHtml(node.name || node.id || '')}</div>
                <div class="tip-kw">${escapeHtml(kws)}</div>`;
            hoverTip.style.display = 'block';
            const pad = 14;
            let left = clientX + pad;
            let top = clientY + pad;
            const rect = hoverTip.getBoundingClientRect();
            if (left + rect.width > window.innerWidth - 8) left = clientX - rect.width - pad;
            if (top + rect.height > window.innerHeight - 8) top = clientY - rect.height - pad;
            hoverTip.style.left = `${Math.max(8, left)}px`;
            hoverTip.style.top = `${Math.max(8, top)}px`;
        }

        function hideHoverTip() {
            hoverTip.style.display = 'none';
        }

        function showToast(msg, ms = 2200) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        function updateEmptyHint() {
            const anyProf = professorMeshes.some(m => m.visible && (m.material.opacity || 0) > 0.15);
            const anyCourse = courseMeshes.some(m => m.visible && (m.material.opacity || 0) > 0.15);
            emptyHint.style.opacity = (anyProf || anyCourse) ? '0' : '1';
        }

        function ensureEdgeIndex(id) {
            if (!edgesByNode.has(id)) edgesByNode.set(id, []);
            return edgesByNode.get(id);
        }

        function searchBlob(node) {
            const parts = [
                node.name || '',
                ...(node.keywords || []),
                ...(node.subfield_keywords || []),
                node.description || '',
                node.text_preview || '',
                node.affiliation || '',
                node.instructor_name || '',
                node.major_name || '',
            ];
            return parts.join('\n').toLowerCase();
        }

        function scoreNodeAgainstTerms(node, terms) {
            const blob = searchBlob(node);
            let score = 0;
            for (const term of terms) {
                const t = String(term).trim().toLowerCase();
                if (!t) continue;
                if ((node.name || '').toLowerCase().includes(t)) score += 6;
                const kwHit = (node.keywords || []).some(k => String(k).toLowerCase().includes(t));
                if (kwHit) score += 4;
                if (blob.includes(t)) score += 2;
            }
            return score;
        }

        function parseQuery(q) {
            return String(q || '')
                .split(/[\s　、,，/|]+/)
                .map(s => s.trim())
                .filter(Boolean);
        }

        function findEntryCourses(terms, limit = ENTRY_COUNT) {
            const scored = [];
            for (const mesh of nodeMeshes) {
                const node = mesh.userData;
                if (node.type !== 'course') continue;
                const s = scoreNodeAgainstTerms(node, terms);
                if (s > 0) scored.push({ mesh, score: s });
            }
            scored.sort((a, b) => b.score - a.score || a.mesh.userData.name.localeCompare(b.mesh.userData.name, 'ja'));
            return scored.slice(0, limit).map(x => x.mesh);
        }

        function targetOpacityFor(mesh) {
            const t = mesh.userData.type;
            if (t === 'major') return MAJOR_OPACITY_FAR;
            if (t === 'field') return FIELD_OPACITY_FAR;
            if (t === 'professor') return 1.0;
            return 0.78;
        }

        function fieldWireOpacity(mesh) {
            const isMajor = mesh.userData.type === 'major';
            const farOp = isMajor ? MAJOR_OPACITY_FAR : FIELD_OPACITY_FAR;
            const nearOp = isMajor ? MAJOR_OPACITY_NEAR : FIELD_OPACITY_NEAR;
            const dist = camera.position.distanceTo(mesh.position);
            // Far = landmark; near = fade so members stay clickable
            if (dist <= LOD_FIELD_NEAR) return nearOp;
            if (dist >= LOD_FIELD_FAR * 1.35) return farOp;
            const t = (dist - LOD_FIELD_NEAR) / (LOD_FIELD_FAR * 1.35 - LOD_FIELD_NEAR);
            return nearOp + (farOp - nearOp) * Math.max(0, Math.min(1, t));
        }

        function revealNode(mesh, { animate = true, pin = true } = {}) {
            if (!mesh) return;
            if (isLandmark(mesh.userData)) return; // always managed as landmarks
            if (pin) searchPinned.add(mesh.userData.id);
            mesh.visible = true;
            mesh.material.transparent = true;
            syncNodeLabel(mesh);
            if (mesh.userData.billboardEl) {
                mesh.userData.billboardEl.style.opacity = '1';
            }
            if (!animate) {
                mesh.material.opacity = targetOpacityFor(mesh);
                return;
            }
            if (mesh.material.opacity < 0.05) mesh.material.opacity = 0;
            fadeAnims.push({
                kind: 'node',
                mesh,
                from: mesh.material.opacity,
                to: targetOpacityFor(mesh),
                t: 0,
                dur: 0.55,
            });
        }

        function edgeBaseOpacity(rec) {
            if (rec.type === 'field_hierarchy') return 0.22;
            if (rec.type === 'belongs_to_field') return 0.28;
            if (rec.type === 'taught_by') return 0.22;
            // discovery similarity: keep faint (~0.2)
            return 0.2;
        }

        function revealEdge(rec, { animate = true, pin = true } = {}) {
            if (!rec || !rec.line) return;
            if (pin) rec.pinned = true;
            rec.line.visible = true;
            const to = edgeBaseOpacity(rec);
            if (!animate) {
                rec.material.opacity = to;
                return;
            }
            if (rec.material.opacity < 0.02) rec.material.opacity = 0;
            fadeAnims.push({
                kind: 'edge',
                rec,
                from: rec.material.opacity,
                to,
                t: 0,
                dur: 0.5,
            });
        }

        function hideAllNetwork() {
            fadeAnims.length = 0;
            searchPinned.clear();
            for (const mesh of midMeshes) {
                mesh.visible = false;
                mesh.material.opacity = 0;
                mesh.scale.set(1, 1, 1);
                if (mesh.userData.billboardEl) {
                    mesh.userData.billboardEl.style.opacity = '0';
                }
                if (mesh.userData.glowMat) {
                    mesh.userData.glowMat.opacity = 0;
                }
                syncNodeLabel(mesh);
            }
            for (const rec of edgeRecords) {
                rec.pinned = false;
                if (rec.type === 'field_hierarchy') {
                    rec.line.visible = true;
                    rec.material.opacity = edgeBaseOpacity(rec);
                    continue;
                }
                rec.line.visible = false;
                rec.material.opacity = 0;
            }
            // Landmarks stay visible (wireframe)
            for (const mesh of fieldMeshes) {
                mesh.visible = true;
                mesh.material.opacity = fieldWireOpacity(mesh);
                mesh.scale.set(1, 1, 1);
                syncNodeLabel(mesh);
            }
            clearSelection({ keepPanel: false });
            updateEmptyHint();
        }

        function clearSelection({ keepPanel = false } = {}) {
            if (selectedNode) {
                selectedNode.scale.set(1, 1, 1);
            }
            // Restore course scales from focus
            if (focusHighlight) {
                for (const cid of focusHighlight.courseIds) {
                    const m = meshById[cid];
                    if (m) m.scale.set(1, 1, 1);
                }
                for (const rec of focusHighlight.edges) {
                    if (rec.baseColor != null) {
                        rec.material.color.setHex(rec.baseColor);
                    }
                    rec._focusTinted = false;
                    // keep pinned if search-expanded; only unpin focus-only pins
                    if (rec._focusPinned) {
                        rec.pinned = false;
                        delete rec._focusPinned;
                    }
                }
            }
            selectedNode = null;
            focusHighlight = null;
            hoveredNode = null;
            hideHoverTip();
            if (!keepPanel) infoPanel.style.display = 'none';
        }

        function setProfessorFocus(mesh) {
            const profId = mesh.userData.id;
            const courseIds = new Set();
            const edges = new Set();
            for (const rec of edgesByNode.get(profId) || []) {
                if (rec.type !== 'taught_by') continue;
                const otherId = rec.source === profId ? rec.target : rec.source;
                const other = meshById[otherId];
                if (!other || other.userData.type !== 'course') continue;
                courseIds.add(otherId);
                edges.add(rec);
                if (!rec.pinned) {
                    rec.pinned = true;
                    rec._focusPinned = true;
                }
                revealNode(other, { animate: false, pin: true });
            }
            focusHighlight = { profId, courseIds, edges };
        }

        function flyToPoints(points, { distance = 42, duration = 1.1 } = {}) {
            if (!points.length) return;
            const box = new THREE.Box3();
            points.forEach(p => box.expandByPoint(p));
            const center = new THREE.Vector3();
            box.getCenter(center);
            const size = new THREE.Vector3();
            box.getSize(size);
            const radius = Math.max(size.length() * 0.55, 8);
            const dist = Math.max(distance, radius * 2.4);

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const endTarget = center.clone();
            const dir = startPos.clone().sub(startTarget);
            if (dir.lengthSq() < 0.01) dir.set(0.35, 0.25, 1);
            dir.normalize();
            const endPos = endTarget.clone().add(dir.multiplyScalar(dist));

            camTween = {
                t: 0,
                dur: duration,
                startPos,
                endPos,
                startTarget,
                endTarget,
            };
        }

        function flyToNode(mesh) {
            if (!mesh) return;
            const dist = isLandmark(mesh.userData) ? 22
                : mesh.userData.type === 'course' ? 11
                : 16;
            flyToPoints([mesh.position.clone()], { distance: dist, duration: 0.9 });
        }

        function addTrail(node) {
            if (!node || trail.some(t => t.id === node.id)) return;
            trail.push({
                id: node.id,
                name: node.name || node.id,
                type: node.type || 'unknown',
            });
            renderTrail();
        }

        function renderTrail() {
            trailList.innerHTML = '';
            trail.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'trail-item';
                btn.innerHTML = `
                    <span class="trail-dot ${escapeHtml(item.type)}"></span>
                    <span>
                        <div class="trail-meta">${idx + 1}. ${
                            item.type === 'professor' ? '教員'
                            : item.type === 'course' ? '講義'
                            : item.type === 'major' ? '大分野'
                            : item.type === 'field' ? '研究分野'
                            : item.type
                        }</div>
                        <div class="trail-name">${escapeHtml(
                            (item.type === 'field' || item.type === 'major')
                                ? `分野: ${item.name}`
                                : item.name
                        )}</div>
                    </span>`;
                btn.addEventListener('click', () => {
                    const mesh = meshById[item.id];
                    if (!mesh) return;
                    revealNode(mesh, { animate: false });
                    mesh.material.opacity = targetOpacityFor(mesh);
                    focusNode(mesh, { flyCamera: true, expand: false, recordTrail: false });
                });
                trailList.appendChild(btn);
            });
        }

        function clearTrail() {
            trail.length = 0;
            renderTrail();
            if (trailFilterOn) applyLodVisibility();
        }

        function setTrailFilter(on) {
            trailFilterOn = !!on;
            const toggle = document.getElementById('trail-filter-toggle');
            if (toggle) toggle.checked = trailFilterOn;
            if (trailFilterOn && !trail.length) {
                showToast('痕跡がまだありません。ノードをクリックして蓄積してください');
            }
            applyLodVisibility();
        }

        function expandFromNode(mesh) {
            if (!mesh) return;
            const nid = mesh.userData.id;
            const ntype = mesh.userData.type;
            const connected = edgesByNode.get(nid) || [];

            // Field landmark: reveal member professors + belongs_to_field edges
            if (ntype === 'field' || ntype === 'major') {
                const memberEdges = connected.filter(e => e.type === 'belongs_to_field');
                const neighborMeshes = [];
                for (const rec of memberEdges) {
                    const otherId = rec.source === nid ? rec.target : rec.source;
                    const other = meshById[otherId];
                    if (other && other.userData.type === 'professor') {
                        revealNode(other);
                        neighborMeshes.push(other);
                    }
                    revealEdge(rec);
                }
                if (neighborMeshes.length) {
                    flyToPoints(
                        [mesh.position, ...neighborMeshes.map(m => m.position)],
                        { distance: 32, duration: 0.95 }
                    );
                } else {
                    flyToNode(mesh);
                }
                updateEmptyHint();
                return;
            }

            const taught = connected.filter(e => e.type === 'taught_by');
            const belongs = connected.filter(e => e.type === 'belongs_to_field');
            const sims = connected
                .filter(e => e.type === 'similarity')
                .slice()
                .sort((a, b) => (b.score || 0) - (a.score || 0))
                .slice(0, SIM_EXPAND_TOP);

            const toReveal = [...taught, ...belongs, ...sims];
            const neighborMeshes = [];

            for (const rec of toReveal) {
                const otherId = rec.source === nid ? rec.target : rec.source;
                const other = meshById[otherId];
                if (other && !isLandmark(other.userData)) {
                    revealNode(other);
                    neighborMeshes.push(other);
                }
                if (rec.type !== 'field_hierarchy') revealEdge(rec);
            }

            if (neighborMeshes.length) {
                flyToPoints(
                    [mesh.position, ...neighborMeshes.map(m => m.position)],
                    { distance: 36, duration: 0.95 }
                );
            }
            updateEmptyHint();
        }

        function focusNode(mesh, { flyCamera = false, expand = true, recordTrail = true } = {}) {
            if (!mesh) return;
            // Landmarks may be faded but still focusable via trail / search
            if (!mesh.visible && !isLandmark(mesh.userData)) return;

            if (selectedNode && selectedNode !== mesh) {
                selectedNode.scale.set(1, 1, 1);
            }
            // Clear previous professor focus tint before applying a new one
            if (focusHighlight && (!selectedNode || selectedNode !== mesh)) {
                for (const cid of focusHighlight.courseIds) {
                    const m = meshById[cid];
                    if (m && m !== mesh) m.scale.set(1, 1, 1);
                }
                for (const rec of focusHighlight.edges) {
                    if (rec.baseColor != null) rec.material.color.setHex(rec.baseColor);
                    rec._focusTinted = false;
                    if (rec._focusPinned) {
                        rec.pinned = false;
                        delete rec._focusPinned;
                    }
                }
                focusHighlight = null;
            }

            selectedNode = mesh;
            const boost = isLandmark(mesh.userData) ? 1.2 : 1.85;
            mesh.scale.set(boost, boost, boost);
            showInfo(mesh.userData);

            if (recordTrail) addTrail(mesh.userData);

            if (mesh.userData.type === 'professor') {
                setProfessorFocus(mesh);
            } else {
                focusHighlight = null;
            }

            if (expand) expandFromNode(mesh);
            if (flyCamera) flyToNode(mesh);
            applyLodVisibility();
        }

        function startExploration(terms, label) {
            const clean = (terms || []).map(t => String(t).trim()).filter(Boolean);
            if (!clean.length) {
                showToast('興味のある言葉を入力してください');
                return;
            }
            if (!dataReady) {
                showToast('データを読み込み中です…');
                return;
            }

            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));

            // Prefer field landmarks matching the query; fall back to courses
            const fieldHits = [];
            for (const mesh of fieldMeshes) {
                const s = scoreNodeAgainstTerms(mesh.userData, clean);
                if (s > 0) fieldHits.push({ mesh, score: s });
            }
            fieldHits.sort((a, b) => b.score - a.score);

            if (fieldHits.length) {
                const top = fieldHits.slice(0, 3).map(x => x.mesh);
                flyToPoints(top.map(m => m.position.clone()), { distance: 34, duration: 1.1 });
                focusNode(top[0], { expand: true, recordTrail: true, flyCamera: false });
                showToast(`分野「${top[0].userData.name}」へ近づきます`);
                updateEmptyHint();
                return;
            }

            const entries = findEntryCourses(clean, ENTRY_COUNT);
            if (!entries.length) {
                showToast(`「${label || clean.join(' ')}」に合う分野・講義が見つかりませんでした`);
                return;
            }

            entries.forEach(m => revealNode(m));
            flyToPoints(entries.map(m => m.position.clone()), { distance: 40, duration: 1.15 });
            updateEmptyHint();
            showToast(`${entries.length}件の講義が現れました — クリックして辿ってみましょう`);
        }

        function resetExploration() {
            hideAllNetwork();
            clearTrail();
            setTrailFilter(false);
            camTween = null;
            camera.position.set(0, 40, 165);
            controls.target.set(0, 0, 0);
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            hideHoverTip();
            showToast('遠景に戻りました（分野ランドマークは表示中）');
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function keywordChips(keywords) {
            if (!keywords || !keywords.length) return '<span class="info-value">—</span>';
            return keywords.slice(0, 24).map(kw =>
                `<span class="keyword-chip">${escapeHtml(kw)}</span>`
            ).join('');
        }

        function externalLinkButton({ href, label }) {
            const url = (href || '').trim();
            if (!url) return ''; // no URL → hide button
            return `<a class="ext-link-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)} <span class="ext-icon">↗</span></a>`;
        }

        function showInfo(node) {
            const typeEl = document.getElementById('p-type');
            const nameEl = document.getElementById('p-name');
            typeEl.className = 'type-badge ' + (node.type || '');
            typeEl.textContent = node.type === 'professor' ? '教員'
                : node.type === 'course' ? '講義'
                : node.type === 'major' ? '大分野'
                : node.type === 'field' ? '研究分野'
                : (node.type || '—');
            nameEl.textContent = node.name || node.id || 'Unknown';

            const preview = node.text_preview || node.description || '';
            let html = '';

            if (node.type === 'professor') {
                const researchUrl = (node.researchmap_url || '').trim();
                const ridbUrl = (node.ridb_url || '').trim();
                const linkUrl = researchUrl || ridbUrl || (node.url || '').trim();
                const linkLabel = researchUrl ? 'researchmap を開く' : '研究者情報を開く';
                if (node.photo_url) {
                    html += `<img src="${escapeHtml(node.photo_url)}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(224,138,60,0.6);margin-bottom:10px;">`;
                }
                html += externalLinkButton({ href: linkUrl, label: linkLabel });
                html += `
                    <div class="info-row">
                        <span class="info-label">所属組織</span>
                        <span class="info-value">${escapeHtml(node.affiliation || '—')}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">専門分野キーワード</span>
                        <div>${keywordChips(node.keywords)}</div>
                    </div>
                    <div class="info-row">
                        <span class="info-label">研究概要・紹介</span>
                        <div class="preview-text">${escapeHtml(preview || '—')}</div>
                    </div>`;
            } else if (node.type === 'course') {
                const syllabusUrls = Array.isArray(node.syllabus_urls) && node.syllabus_urls.length
                    ? node.syllabus_urls
                    : [(node.syllabus_url || node.url || '').trim()].filter(Boolean);
                const syllabusUrl = (syllabusUrls[0] || '').trim();
                html += externalLinkButton({ href: syllabusUrl, label: 'シラバス詳細を開く' });
                if (syllabusUrls.length > 1) {
                    const extra = syllabusUrls.slice(1).map((u, i) =>
                        `<a class="info-link" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">別クラス ${i + 2}</a>`
                    ).join(' · ');
                    html += `<div class="info-row"><span class="info-label">他クラスシラバス</span><div>${extra}</div></div>`;
                }
                const instructorIds = Array.isArray(node.instructor_ids) && node.instructor_ids.length
                    ? node.instructor_ids
                    : (node.instructor_id ? [node.instructor_id] : []);
                const instructorNames = (node.instructor_name || '').split(/\s*\/\s*/).filter(Boolean);
                const instructorHtml = instructorIds.length
                    ? instructorIds.map((iid, idx) => {
                        const label = escapeHtml(instructorNames[idx] || iid);
                        return meshById[iid]
                            ? `<button type="button" class="info-link" data-goto="${escapeHtml(iid)}">${label}</button>`
                            : `<span class="info-value">${label}</span>`;
                    }).join(' · ')
                    : `<span class="info-value">—</span>`;
                html += `
                    <div class="info-row">
                        <span class="info-label">担当教員</span>
                        ${instructorHtml}
                    </div>
                    <div class="info-row">
                        <span class="info-label">シラバス・キーワード</span>
                        <div>${keywordChips(node.keywords)}</div>
                    </div>
                    <div class="info-row">
                        <span class="info-label">授業概要・目標</span>
                        <div class="preview-text">${escapeHtml(preview || '—')}</div>
                    </div>`;
            } else if (node.type === 'field' || node.type === 'major') {
                if (node.url) {
                    html += externalLinkButton({ href: node.url, label: 'シーズ集で見る' });
                }
                html += `
                    <div class="info-row">
                        <span class="info-label">${node.type === 'major' ? '大分野' : '研究分野'}</span>
                        <span class="info-value">${escapeHtml(node.name || '—')}</span>
                    </div>`;
                if (node.type === 'field' && node.major_name) {
                    html += `
                    <div class="info-row">
                        <span class="info-label">大分野</span>
                        <span class="info-value">${escapeHtml(node.major_name)}</span>
                    </div>`;
                }
                html += `
                    <div class="info-row">
                        <span class="info-label">紐づく教員（この空間内）</span>
                        <span class="info-value">${Number(node.member_count || 0)} 名</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ヒント</span>
                        <span class="info-value">クリックで所属教員を呼び出し、近づくと顔写真が現れます。</span>
                    </div>`;
            } else {
                html += `<div class="info-row"><span class="info-value">${escapeHtml(preview || node.id)}</span></div>`;
            }

            panelBody.innerHTML = html;
            infoPanel.style.display = 'block';

            const link = panelBody.querySelector('[data-goto]');
            if (link) {
                link.addEventListener('click', (ev) => {
                    ev.preventDefault();
                    const id = link.getAttribute('data-goto');
                    const target = meshById[id];
                    if (!target) return;
                    revealNode(target);
                    // also reveal taught_by edge if any
                    const edges = edgesByNode.get(node.id) || [];
                    edges.filter(e => e.type === 'taught_by' && (e.source === id || e.target === id))
                        .forEach(e => revealEdge(e));
                    focusNode(target, { flyCamera: true, expand: true, recordTrail: true });
                });
            }
        }

        // --- Quick tags UI ---
        const tagsRoot = document.getElementById('quick-tags');
        QUICK_TAGS.forEach(tag => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tag-btn';
            btn.textContent = tag.label;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('search-input').value = tag.label;
                startExploration(tag.terms, tag.label);
            });
            tagsRoot.appendChild(btn);
        });

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = document.getElementById('search-input').value;
            startExploration(parseQuery(q), q.trim());
        });

        document.getElementById('reset-btn').addEventListener('click', resetExploration);

        document.querySelectorAll('#label-mode-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#label-mode-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                labelMode = btn.getAttribute('data-mode') || 'name';
                refreshAllLabels();
            });
        });

        function createProfessorBillboard(node) {
            const wrap = document.createElement('div');
            wrap.className = 'prof-billboard';
            wrap.style.opacity = '0';

            const photoUrl = (node.photo_url || '').trim();
            if (photoUrl) {
                const img = document.createElement('img');
                img.className = 'photo';
                img.alt = '';
                img.referrerPolicy = 'no-referrer';
                img.src = photoUrl;
                img.onerror = () => {
                    img.remove();
                    const ph = document.createElement('div');
                    ph.className = 'photo placeholder';
                    ph.textContent = (node.name || '?').charAt(0);
                    wrap.insertBefore(ph, wrap.firstChild);
                };
                wrap.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'photo placeholder';
                ph.textContent = (node.name || '?').charAt(0);
                wrap.appendChild(ph);
            }

            const cap = document.createElement('div');
            cap.className = 'caption';
            cap.innerHTML = `<span class="nm">${escapeHtml(node.name || node.id || '')}</span>`
                + `<span class="af">${escapeHtml(truncateText(node.affiliation || '', 18))}</span>`;
            wrap.appendChild(cap);
            return wrap;
        }

        function createFieldMesh(node) {
            const isMajor = node.type === 'major';
            const radius = isMajor ? 2.8 : 1.55;
            const geo = new THREE.SphereGeometry(radius, 20, 14);
            const mat = new THREE.MeshBasicMaterial({
                color: isMajor ? MAJOR_COLOR : FIELD_COLOR,
                wireframe: true,
                transparent: true,
                opacity: isMajor ? MAJOR_OPACITY_FAR : FIELD_OPACITY_FAR,
                depthWrite: false,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(node.vec3);
            mesh.userData = node;
            mesh.userData.raycastable = false; // never block professor/course picks
            mesh.visible = true;

            const labelEl = document.createElement('div');
            labelEl.className = `node-label ${node.type}`;
            labelEl.textContent = nameLabelText(node);
            labelEl.title = `${isMajor ? '大分野' : '研究分野'}: ${node.name || node.id}`;
            // Label is the interactive hit target for landmarks (sphere stays non-pickable).
            labelEl.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
            });
            labelEl.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                focusNode(mesh, {
                    expand: true,
                    recordTrail: true,
                    flyCamera: true,
                });
            });
            const labelObj = new THREE.CSS2DObject(labelEl);
            labelObj.position.set(0, isMajor ? 3.4 : 2.1, 0);
            mesh.add(labelObj);
            mesh.userData.labelEl = labelEl;
            mesh.userData.labelObj = labelObj;
            return mesh;
        }

        function createProfessorMesh(node) {
            // Slightly larger radius for reliable picking inside field wireframes
            const geo = new THREE.SphereGeometry(0.72, 16, 16);
            const mat = new THREE.MeshLambertMaterial({
                color: PROF_COLOR,
                transparent: true,
                opacity: 0,
                depthWrite: false,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(node.vec3);
            mesh.userData = node;
            mesh.visible = false;

            const billboardEl = createProfessorBillboard(node);
            const billboard = new THREE.CSS2DObject(billboardEl);
            billboard.position.set(0, 0.2, 0);
            mesh.add(billboard);
            mesh.userData.billboardEl = billboardEl;
            mesh.userData.billboardObj = billboard;

            // Keep a hidden label slot for mode toggle compatibility
            const labelEl = document.createElement('div');
            labelEl.className = 'node-label professor hidden-label';
            const labelObj = new THREE.CSS2DObject(labelEl);
            labelObj.visible = false;
            mesh.add(labelObj);
            mesh.userData.labelEl = labelEl;
            mesh.userData.labelObj = labelObj;
            return mesh;
        }

        function courseLodAlpha(mesh) {
            // Spatial discovery: fade in by proximity to the course's own UMAP position.
            // Clicking a professor still pins taught_by courses via expandFromNode + searchPinned.
            const focus = controls.target;
            const distCam = camera.position.distanceTo(mesh.position);
            const distFocus = focus.distanceTo(mesh.position);
            const alphaCam = lodAlpha(distCam, LOD_COURSE_NEAR, LOD_COURSE_FAR);
            const alphaFocus = lodAlpha(distFocus, LOD_COURSE_NEAR * 0.7, LOD_COURSE_FAR * 0.9);
            return Math.max(alphaCam, alphaFocus * 0.9);
        }

        function createCourseMesh(node) {
            const geo = new THREE.SphereGeometry(0.28, 10, 10);
            const mat = new THREE.MeshBasicMaterial({
                color: COURSE_COLOR,
                transparent: true,
                opacity: 0,
                depthWrite: false,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(node.vec3);
            mesh.userData = node;
            mesh.visible = false;

            // Soft glow shell
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(0.42, 10, 10),
                new THREE.MeshBasicMaterial({
                    color: 0x8ecae6,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                })
            );
            mesh.add(glow);
            mesh.userData.glowMat = glow.material;

            const labelEl = document.createElement('div');
            labelEl.className = 'node-label course hidden-label';
            labelEl.textContent = nameLabelText(node);
            const labelObj = new THREE.CSS2DObject(labelEl);
            labelObj.position.set(0, 0.45, 0);
            labelObj.visible = false;
            mesh.add(labelObj);
            mesh.userData.labelEl = labelEl;
            mesh.userData.labelObj = labelObj;
            return mesh;
        }

        function applyLodVisibility() {
            if (!dataReady) return;
            const activeFields = getActiveFieldAlphas();
            const visited = trailFilterOn ? new Set(trail.map(t => t.id)) : null;

            // Field landmarks: wireframe LoD (fade when close so members stay clear)
            for (const mesh of fieldMeshes) {
                const op = fieldWireOpacity(mesh);
                mesh.visible = true;
                mesh.material.opacity = op;
                mesh.material.depthWrite = false;
                // Near: soften labels too
                const dist = camera.position.distanceTo(mesh.position);
                if (mesh.userData.labelEl) {
                    if (dist < LOD_FIELD_NEAR * 0.85) {
                        mesh.userData.labelEl.style.opacity = String(Math.max(0.12, op * 1.2));
                    }
                }
                syncNodeLabel(mesh);
            }

            // Pass 1: professors (mid)
            for (const mesh of professorMeshes) {
                const fading = fadeAnims.some(a => a.kind === 'node' && a.mesh === mesh);
                if (fading) continue;
                const pinned = searchPinned.has(mesh.userData.id);
                let alpha = professorLodAlpha(mesh, activeFields);
                if (pinned) alpha = Math.max(alpha, 0.75);
                if (visited && visited.has(mesh.userData.id)) alpha = Math.max(alpha, 0.85);
                const show = alpha > 0.04;
                mesh.visible = show;
                mesh.material.opacity = show ? alpha * targetOpacityFor(mesh) : 0;
                mesh.material.depthWrite = mesh.material.opacity > 0.85;
                if (mesh.userData.billboardEl) {
                    mesh.userData.billboardEl.style.opacity = show ? String(alpha) : '0';
                }
                syncNodeLabel(mesh);
            }

            // Pass 2: courses (near) — by own position in space; global + per-instructor caps
            const courseCandidates = [];
            for (const mesh of courseMeshes) {
                const fading = fadeAnims.some(a => a.kind === 'node' && a.mesh === mesh);
                if (fading) continue;
                const pinned = searchPinned.has(mesh.userData.id);
                let alpha = courseLodAlpha(mesh);
                if (pinned) alpha = Math.max(alpha, 0.65);
                if (visited && visited.has(mesh.userData.id)) alpha = Math.max(alpha, 0.8);
                if (alpha > 0.05 || pinned || (visited && visited.has(mesh.userData.id))) {
                    courseCandidates.push({
                        mesh,
                        alpha,
                        pinned: pinned || !!(visited && visited.has(mesh.userData.id)),
                        dist: camera.position.distanceTo(mesh.position),
                        instructorId: mesh.userData.instructor_id || '',
                    });
                } else {
                    mesh.visible = false;
                    mesh.material.opacity = 0;
                    if (mesh.userData.glowMat) mesh.userData.glowMat.opacity = 0;
                    syncNodeLabel(mesh);
                }
            }
            const COURSE_CAP_GLOBAL = 48;
            const COURSE_CAP_PER_PROF = 8;
            courseCandidates.sort((a, b) => {
                if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
                return a.dist - b.dist;
            });
            const keep = new Set();
            const perProf = new Map();
            for (const row of courseCandidates) {
                if (row.pinned) {
                    keep.add(row.mesh.userData.id);
                    continue;
                }
                const iid = row.instructorId || '_';
                const n = perProf.get(iid) || 0;
                if (n >= COURSE_CAP_PER_PROF) continue;
                if (keep.size >= COURSE_CAP_GLOBAL) continue;
                keep.add(row.mesh.userData.id);
                perProf.set(iid, n + 1);
            }
            for (const row of courseCandidates) {
                const mesh = row.mesh;
                const show = keep.has(mesh.userData.id);
                const alpha = show ? row.alpha : 0;
                mesh.visible = show && alpha > 0.05;
                mesh.material.opacity = mesh.visible ? alpha * 0.95 : 0;
                if (mesh.userData.glowMat) {
                    mesh.userData.glowMat.opacity = mesh.visible ? alpha * 0.22 : 0;
                }
                syncNodeLabel(mesh);
            }

            for (const rec of edgeRecords) {
                // Reset focus tint each frame before re-applying
                if (rec.baseColor != null && rec._focusTinted) {
                    rec.material.color.setHex(rec.baseColor);
                    rec._focusTinted = false;
                }

                if (rec.type === 'field_hierarchy') {
                    rec.line.visible = true;
                    rec.material.opacity = edgeBaseOpacity(rec);
                    continue;
                }

                const src = meshById[rec.source];
                const tgt = meshById[rec.target];
                if (!src || !tgt) {
                    rec.line.visible = false;
                    rec.material.opacity = 0;
                    continue;
                }

                const bothNearEnough = (() => {
                    if (rec.pinned) return src.visible && tgt.visible;
                    if (visited && visited.has(rec.source) && visited.has(rec.target)) {
                        return src.visible && tgt.visible;
                    }
                    if (rec.type === 'similarity') return false;
                    if (rec.type === 'belongs_to_field') {
                        const prof = src.userData.type === 'professor' ? src : tgt;
                        return !!(prof && prof.visible && (prof.material.opacity || 0) > 0.12);
                    }
                    if (rec.type === 'taught_by') {
                        // Only when lecture satellite is visible (near view)
                        const course = src.userData.type === 'course' ? src : tgt;
                        return !!(course && course.visible && (course.material.opacity || 0) > 0.08);
                    }
                    return false;
                })();

                if (!bothNearEnough) {
                    rec.line.visible = false;
                    rec.material.opacity = 0;
                    continue;
                }

                const base = edgeBaseOpacity(rec);
                const dEdge = Math.min(
                    camera.position.distanceTo(src.position),
                    camera.position.distanceTo(tgt.position)
                );
                const a = rec.pinned ? 1 : lodAlpha(dEdge, LOD_EDGE_NEAR, LOD_EDGE_FAR);
                rec.line.visible = a > 0.05;
                rec.material.opacity = base * Math.max(a, rec.type === 'taught_by' ? 0.55 : a);
            }

            // --- Focus mode: emphasize selected professor ↔ taught courses ---
            if (focusHighlight) {
                const { profId, courseIds, edges } = focusHighlight;
                for (const mesh of midMeshes) {
                    const id = mesh.userData.id;
                    const keepFocus = id === profId || courseIds.has(id);
                    if (!keepFocus) {
                        if (mesh.visible) {
                            mesh.material.opacity = Math.min(mesh.material.opacity || 0, FOCUS_DIM);
                            if (mesh.userData.billboardEl) {
                                mesh.userData.billboardEl.style.opacity = String(FOCUS_DIM);
                            }
                            if (mesh.userData.glowMat) {
                                mesh.userData.glowMat.opacity = Math.min(
                                    mesh.userData.glowMat.opacity || 0,
                                    FOCUS_DIM * 0.5
                                );
                            }
                        }
                        if (mesh !== selectedNode) mesh.scale.set(1, 1, 1);
                    } else if (courseIds.has(id)) {
                        mesh.visible = true;
                        mesh.material.opacity = Math.max(mesh.material.opacity || 0, 0.95);
                        mesh.scale.set(1.65, 1.65, 1.65);
                        if (mesh.userData.glowMat) {
                            mesh.userData.glowMat.opacity = 0.45;
                        }
                        syncNodeLabel(mesh);
                    }
                }
                for (const mesh of fieldMeshes) {
                    mesh.material.opacity = Math.min(mesh.material.opacity, FOCUS_DIM + 0.02);
                }
                for (const rec of edgeRecords) {
                    if (edges.has(rec)) {
                        if (rec.baseColor == null) rec.baseColor = rec.material.color.getHex();
                        rec.material.color.setHex(TAUGHT_BY_FOCUS_COLOR);
                        rec._focusTinted = true;
                        rec.line.visible = true;
                        rec.material.opacity = 1.0;
                        rec.pinned = true;
                    } else if (rec.line.visible) {
                        rec.material.opacity = Math.min(rec.material.opacity || 0, FOCUS_DIM);
                    }
                }
            }

            // --- Trail filter: only visited nodes (and their mutual edges) stand out ---
            if (visited) {
                for (const mesh of nodeMeshes) {
                    if (visited.has(mesh.userData.id)) continue;
                    if (isLandmark(mesh.userData)) {
                        mesh.material.opacity = Math.min(mesh.material.opacity || 0, TRAIL_DIM);
                        if (mesh.userData.labelEl) {
                            mesh.userData.labelEl.style.opacity = String(TRAIL_DIM);
                        }
                    } else {
                        mesh.material.opacity = Math.min(mesh.material.opacity || 0, TRAIL_DIM);
                        if (mesh.userData.billboardEl) {
                            mesh.userData.billboardEl.style.opacity = String(TRAIL_DIM);
                        }
                        if (mesh.userData.glowMat) {
                            mesh.userData.glowMat.opacity = Math.min(
                                mesh.userData.glowMat.opacity || 0,
                                TRAIL_DIM * 0.4
                            );
                        }
                        if ((mesh.material.opacity || 0) < 0.03) {
                            mesh.visible = false;
                        }
                    }
                }
                for (const rec of edgeRecords) {
                    const keepEdge = visited.has(rec.source) && visited.has(rec.target);
                    if (!keepEdge && rec.line.visible) {
                        rec.material.opacity = Math.min(rec.material.opacity || 0, TRAIL_DIM);
                    }
                }
            }

            updateEmptyHint();
        }

        // --- Load network ---
        fetch('/api/network')
            .then(res => res.json())
            .then(data => {
                data.nodes.forEach(node => {
                    const px = node.position.x * SCALE;
                    const py = node.position.y * SCALE;
                    const pz = node.position.z * SCALE;
                    node.vec3 = new THREE.Vector3(px, py, pz);
                    nodeDict[node.id] = node;
                });

                separateOverlappingNodes();

                data.nodes.forEach(node => {
                    let mesh;
                    if (node.type === 'field' || node.type === 'major') {
                        mesh = createFieldMesh(node);
                        fieldMeshes.push(mesh);
                    } else if (node.type === 'professor') {
                        mesh = createProfessorMesh(node);
                        professorMeshes.push(mesh);
                        midMeshes.push(mesh);
                    } else if (node.type === 'course') {
                        mesh = createCourseMesh(node);
                        courseMeshes.push(mesh);
                        midMeshes.push(mesh);
                    } else {
                        return;
                    }
                    scene.add(mesh);
                    nodeMeshes.push(mesh);
                    meshById[node.id] = mesh;
                });

                // Course positions come from joint syllabus UMAP (Analysis);
                // do not re-orbit them around instructors.

                data.edges.forEach(edge => {
                    const source = nodeDict[edge.source];
                    const target = nodeDict[edge.target];
                    if (!source || !target) return;

                    const score = Number(edge.similarity ?? edge.score ?? 0) || 0;
                    const type = edge.type || 'similarity';
                    const geo = new THREE.BufferGeometry().setFromPoints([source.vec3, target.vec3]);

                    let mat;
                    let line;
                    if (type === 'similarity') {
                        mat = new THREE.LineDashedMaterial({
                            color: 0x7eb8d4,
                            transparent: true,
                            opacity: 0,
                            dashSize: 0.55,
                            gapSize: 0.4,
                            depthWrite: false,
                        });
                        line = new THREE.Line(geo, mat);
                        line.computeLineDistances();
                        line.renderOrder = 0;
                    } else if (type === 'field_hierarchy') {
                        mat = new THREE.LineBasicMaterial({
                            color: 0x5a7a90,
                            transparent: true,
                            opacity: 0.22,
                            depthWrite: false,
                        });
                        line = new THREE.Line(geo, mat);
