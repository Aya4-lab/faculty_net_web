                        line.renderOrder = 0;
                        line.visible = true;
                    } else if (type === 'belongs_to_field') {
                        mat = new THREE.LineBasicMaterial({
                            color: 0xc4a06a,
                            transparent: true,
                            opacity: 0,
                            depthWrite: false,
                        });
                        line = new THREE.Line(geo, mat);
                        line.renderOrder = 1;
                        line.visible = false;
                        if (!fieldMemberIds.has(edge.target)) fieldMemberIds.set(edge.target, new Set());
                        fieldMemberIds.get(edge.target).add(edge.source);
                    } else {
                        mat = new THREE.LineBasicMaterial({
                            color: 0xc8cdd4,
                            transparent: true,
                            opacity: 0,
                            depthWrite: false,
                        });
                        line = new THREE.Line(geo, mat);
                        line.renderOrder = 1;
                        line.visible = false;
                    }
                    scene.add(line);

                    const rec = {
                        source: edge.source,
                        target: edge.target,
                        type,
                        score,
                        line,
                        material: mat,
                        pinned: false,
                    };
                    edgeRecords.push(rec);
                    ensureEdgeIndex(edge.source).push(rec);
                    ensureEdgeIndex(edge.target).push(rec);
                });

                dataReady = true;
                camera.position.set(0, 40, 165);
                applyLodVisibility();
                updateVisibleLabelDistances();
                const nField = fieldMeshes.length;
                const nProf = professorMeshes.length;
                const nCourse = courseMeshes.length;
                showToast(`分野 ${nField} ・ 教員 ${nProf} ・ 講義 ${nCourse}`, 2800);
            })
            .catch(err => {
                console.error(err);
                showToast('ネットワークデータの読み込みに失敗しました');
            });

        function pickVisibleNode(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            // Field/major wireframes are never pickable — professors & courses stay clickable inside.
            const pickable = midMeshes.filter(
                m => m.visible && (m.material.opacity || 0) > 0.08
            );
            // Enlarge pick threshold slightly when near so dense clusters remain usable
            raycaster.params.Points = raycaster.params.Points || {};
            const hits = raycaster.intersectObjects(pickable, false);
            return hits.length ? hits[0].object : null;
        }

        function isUiEvent(event) {
            if (leftPanel.contains(event.target) || infoPanel.contains(event.target)) {
                return true;
            }
            // Field/major CSS2D labels are interactive HTML — don't treat as canvas picks.
            const t = event.target;
            if (t && t.closest && t.closest('.node-label.field, .node-label.major')) {
                return true;
            }
            return false;
        }

        window.addEventListener('mousemove', (event) => {
            if (isUiEvent(event)) {
                document.body.style.cursor = 'default';
                hideHoverTip();
                return;
            }
            const object = pickVisibleNode(event);
            if (object) {
                if (hoveredNode && hoveredNode !== object && hoveredNode !== selectedNode) {
                    hoveredNode.scale.set(1, 1, 1);
                }
                hoveredNode = object;
                if (object !== selectedNode) object.scale.set(1.4, 1.4, 1.4);
                document.body.style.cursor = 'pointer';
                showHoverTip(object.userData, event.clientX, event.clientY);
            } else {
                if (hoveredNode && hoveredNode !== selectedNode) {
                    hoveredNode.scale.set(1, 1, 1);
                }
                hoveredNode = null;
                document.body.style.cursor = 'default';
                hideHoverTip();
            }
        });

        let pointerDown = null;
        window.addEventListener('pointerdown', (event) => {
            if (isUiEvent(event)) return;
            pointerDown = { x: event.clientX, y: event.clientY };
        });

        window.addEventListener('click', (event) => {
            if (isUiEvent(event)) return;
            if (pointerDown) {
                const dx = event.clientX - pointerDown.x;
                const dy = event.clientY - pointerDown.y;
                if (dx * dx + dy * dy > 16) return;
            }
            const object = pickVisibleNode(event);
            if (object) {
                focusNode(object, { expand: true, recordTrail: true });
            } else {
                // Background click: clear selection / focus emphasis
                clearSelection();
                applyLodVisibility();
            }
        });

        document.getElementById('panel-close').addEventListener('click', (e) => {
            e.stopPropagation();
            clearSelection();
            applyLodVisibility();
        });

        document.getElementById('clear-trail-btn').addEventListener('click', () => {
            clearTrail();
            showToast('探索の痕跡をクリアしました');
        });

        document.getElementById('trail-filter-toggle').addEventListener('change', (e) => {
            setTrailFilter(e.target.checked);
            showToast(
                e.target.checked
                    ? '探索の痕跡のみを表示しています'
                    : 'すべてのノードを表示しています'
            );
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        let lastTs = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTs) / 1000);
            lastTs = now;

            if (camTween) {
                camTween.t += dt;
                const u = Math.min(1, camTween.t / camTween.dur);
                const e = easeInOut(u);
                camera.position.lerpVectors(camTween.startPos, camTween.endPos, e);
                controls.target.lerpVectors(camTween.startTarget, camTween.endTarget, e);
                if (u >= 1) camTween = null;
            }

            for (let i = fadeAnims.length - 1; i >= 0; i--) {
                const a = fadeAnims[i];
                a.t += dt;
                const u = Math.min(1, a.t / a.dur);
                const e = easeInOut(u);
                const op = a.from + (a.to - a.from) * e;
                if (a.kind === 'node') {
                    a.mesh.material.opacity = op;
                    a.mesh.material.depthWrite = op > 0.85;
                } else {
                    a.rec.material.opacity = op;
                }
                if (u >= 1) fadeAnims.splice(i, 1);
            }

            controls.update();
            lodFrame += 1;
            if (lodFrame % 2 === 0) applyLodVisibility();
            updateVisibleLabelDistances();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
